[phases.build]
cmds = [
  "npm ci",
  "mkdir -p /app/bin",
  "wget -q https://github.com/krakenfx/kraken-cli/releases/latest/download/kraken-cli-x86_64-unknown-linux-gnu.tar.gz -O /tmp/kraken.tar.gz",
  "tar -xzf /tmp/kraken.tar.gz -C /app/bin/",
  "chmod +x /app/bin/kraken",
  "echo 'Kraken binary ready at /app/bin/kraken'",
  "npx convex deploy"
]

[start]
cmd = "node -e \"require('child_process').execSync('/app/bin/kraken --version', {stdio:'inherit'})\" && npx tsx agent/loop.ts"
